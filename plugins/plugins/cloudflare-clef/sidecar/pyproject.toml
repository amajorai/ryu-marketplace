[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ryu-cloudflare-clef-sidecar"
version = "0.1.0"
description = "Authenticated Workers AI adapter for the Ryu Decision Models layer"
requires-python = ">=3.11"
dependencies = [
  # FastAPI 0.133+ accepts Starlette 1.x; Starlette 1.3.1 clears the 0.x/1.0 advisories.
  "fastapi>=0.133.0,<1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
server = []

[tool.setuptools.packages.find]
include = ["ryu_cloudflare_clef*"]
