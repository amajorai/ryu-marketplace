[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ryu-cloudflare-clef-sidecar"
version = "0.1.0"
description = "Authenticated Workers AI adapter for the Ryu Decision Models layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
server = []

[tool.setuptools.packages.find]
include = ["ryu_cloudflare_clef*"]
